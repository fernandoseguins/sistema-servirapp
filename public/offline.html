<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SerVir — Sem conexão</title>
  <meta name="theme-color" content="#1f2937" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100svh;
      background: #0f172a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      text-align: center;
      color: #f1f5f9;
    }

    .logo-wrap {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: #1e293b;
      border: 1px solid #334155;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1.5rem;
      animation: pulse 2s ease-in-out infinite;
    }

    .logo-wrap img {
      width: 52px;
      height: 52px;
      object-fit: contain;
      border-radius: 50%;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.7; transform: scale(0.96); }
    }

    .wifi-icon {
      font-size: 40px;
      margin-bottom: 1.5rem;
      opacity: 0.5;
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }

    p {
      font-size: 14px;
      color: #94a3b8;
      line-height: 1.6;
      max-width: 300px;
      margin-bottom: 2rem;
    }

    .badge {
      display: inline-block;
      background: #1e293b;
      border: 1px solid #334155;
      color: #64748b;
      font-size: 11px;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: 20px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 2rem;
    }

    .btn-primary {
      display: block;
      width: 100%;
      max-width: 280px;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 14px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 0.75rem;
      transition: background 0.15s;
    }
    .btn-primary:hover { background: #1d4ed8; }

    .btn-secondary {
      display: block;
      width: 100%;
      max-width: 280px;
      background: transparent;
      color: #64748b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 12px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: border-color 0.15s;
    }
    .btn-secondary:hover { border-color: #475569; color: #94a3b8; }

    .status {
      margin-top: 2rem;
      font-size: 12px;
      color: #475569;
    }

    .dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #ef4444;
      margin-right: 6px;
      vertical-align: middle;
      animation: blink 1.5s ease-in-out infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.2; }
    }
  </style>
</head>
<body>

  <div class="logo-wrap">
    <img src="/logo.png" alt="SerVir" onerror="this.style.display='none'; this.parentElement.innerHTML='✝️'" />
  </div>

  <span class="badge">SerVir</span>

  <h1>Você está offline</h1>

  <p>
    Parece que a conexão caiu. Verifique o seu Wi-Fi ou dados móveis e tente novamente.
  </p>

  <button class="btn-primary" onclick="tentarNovamente()">
    Tentar novamente
  </button>

  <button class="btn-secondary" onclick="voltarInicio()">
    Voltar ao início
  </button>

  <p class="status">
    <span class="dot"></span>
    Sem conexão com a internet
  </p>

  <script>
    function tentarNovamente() {
      window.location.reload()
    }

    function voltarInicio() {
      window.location.href = '/'
    }

    // Quando a conexão voltar, redireciona automaticamente
    window.addEventListener('online', () => {
      window.location.href = '/'
    })
  </script>

</body>
</html>
